name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Older Python images bundle outdated packaging tools with known CVEs; update them first.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports evals/src
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=skill_evals --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  # Whole pipeline with the scripted stand-in model, including the heavy task:
  # the generated Playwright file is scored against bug-hunt-lab's real bugs.
  pipeline:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/bug-hunt-lab
          path: bug-hunt-lab
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - working-directory: bug-hunt-lab
        run: npm ci && npx playwright install --with-deps chromium
      - run: skill-evals --provider fake --repeat 1 --md report.md
        env:
          BUG_HUNT_LAB: bug-hunt-lab

  # Real local-model runs, recorded on a GPU machine and committed to cassettes/.
  replay:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No recordings yet
        if: hashFiles('cassettes/*.json') == ''
        run: echo "No cassettes yet - record one with --record (see README)."
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('cassettes/text-tasks.json') != ''
        with:
          python-version: "3.12"
      - if: hashFiles('cassettes/text-tasks.json') != ''
        run: |
          pip install -e .
          skill-evals --replay cassettes/text-tasks.json --only flaky-triage-1 --only scan-triage-1 \
            --only bug-report-1 --only pr-review-1 --only test-quality-1 --only pr-report-1 \
            --only load-test-1 --only llm-red-team-1 --md report.md
