[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-skills-evals"
version = "0.1.0"
description = "QA skills for AI coding agents, and the harness that measures whether they help."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "bug-report-enhancer @ git+https://github.com/Kurtis-H/bug-report-enhancer",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skill-evals = "skill_evals.cli:main"

[tool.setuptools.packages.find]
where = ["evals/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"evals/src/skill_evals/providers.py" = ["E501"]
"evals/src/skill_evals/graders.py" = ["E501"]
"evals/src/skill_evals/runner.py" = ["E501"]
"tests/*" = ["E501"]
